<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Money Manager by Mavri</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937}.container{max-width:760px;margin:auto;padding:18px}h1{margin:0 0 4px}.sub{color:#6b7280;margin-bottom:18px}.balance{background:#111827;color:#fff;border-radius:18px;padding:22px;margin-bottom:12px}.balance small{color:#d1d5db}.balance h2{font-size:31px;margin:8px 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.card,.box{background:#fff;border-radius:15px;padding:17px;margin-bottom:14px;box-shadow:0 2px 8px #0000000b}.card small{color:#6b7280}.card strong{display:block;font-size:19px;margin-top:7px}.income{color:#16a34a}.expense{color:#dc2626}.box h3{margin:0 0 12px}input,select,button{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:14px;margin-top:7px}button{background:#111827;color:#fff;border:0;font-weight:bold}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#b91c1c}.row,.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}canvas{width:100%;height:210px;background:#fafafa;border-radius:10px;margin-top:8px}.transaction{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eee;gap:8px}.left{display:flex;gap:10px;align-items:center;min-width:0}.icon{width:38px;height:38px;border-radius:50%;background:#f3f4f6;display:grid;place-items:center;flex:none}.name{font-weight:bold}.date{font-size:12px;color:#9ca3af;margin-top:3px}.right{text-align:right;min-width:125px}.amount{font-weight:bold}.mini{width:auto;padding:5px 7px;margin:5px 2px 0;font-size:11px}.empty{text-align:center;color:#9ca3af;padding:25px 0}@media(max-width:500px){.container{padding:12px}.row{grid-template-columns:1fr}.right{min-width:112px}}</style></head><body><div class="container"><h1>Money Manager <span style="font-size:12px;font-weight:normal;color:#9ca3af">by Mavri</span></h1><div class="sub">Catatan pemasukan & pengeluaran pribadi</div><div class="balance"><small>Saldo Saat Ini</small><h2 id="balance">Rp0</h2></div><div class="summary"><div class="card"><small>Total Pemasukan</small><strong class="income" id="income">Rp0</strong></div><div class="card"><small>Total Pengeluaran</small><strong class="expense" id="expense">Rp0</strong></div></div><div class="box"><h3 id="formTitle">Tambah Transaksi</h3><select id="type"><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select><div class="row"><input id="amount" type="number" min="0" placeholder="Jumlah (Rp)"><input id="category" placeholder="Kategori"></div><input id="note" placeholder="Catatan (opsional)"><input id="date" type="date"><div class="row"><button onclick="saveTransaction()" id="saveBtn">+ Tambah Transaksi</button><button class="secondary" onclick="cancelEdit()" id="cancelBtn" style="display:none">Batal Edit</button></div></div><div class="box"><h3>Filter & Grafik</h3><div class="row"><select id="monthFilter" onchange="render()"><option value="all">Semua Bulan</option></select><select id="typeFilter" onchange="render()"><option value="all">Semua Transaksi</option><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select></div><canvas id="chart" width="700" height="210"></canvas></div><div class="box"><h3>Budget Bulanan</h3><div class="row"><input id="budgetInput" type="number" min="0" placeholder="Budget bulanan (Rp)"><button onclick="saveBudget()">Simpan Budget</button></div><div id="budgetInfo" style="margin-top:10px;color:#6b7280;font-size:14px"></div></div><div class="box"><h3>Ringkasan Bulan</h3><div id="monthlySummary" style="line-height:1.8;color:#4b5563"></div></div><div class="box"><h3>Cari Transaksi</h3><input id="searchInput" placeholder="Cari kategori atau catatan..." oninput="render()"></div><div class="box"><h3>Backup Data</h3><div class="tools"><button onclick="exportData()">⬇ Export Backup</button><button class="secondary" onclick="document.getElementById('importFile').click()">⬆ Import Backup</button></div><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><div class="box"><h3>Riwayat Transaksi</h3><div id="list"></div></div></div><script>let transactions=JSON.parse(localStorage.getItem('moneyManagerData')||'[]'),editingId=null;const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function persist(){localStorage.setItem('moneyManagerData',JSON.stringify(transactions));render()}function saveTransaction(){let type=typeEl.value,amount=Number(document.getElementById('amount').value),category=document.getElementById('category').value.trim(),note=document.getElementById('note').value.trim(),date=document.getElementById('date').value||new Date().toISOString().slice(0,10);if(amount<=0||!category)return alert('Jumlah dan kategori wajib diisi.');if(editingId){let t=transactions.find(x=>x.id===editingId);Object.assign(t,{type,amount,category,note,date})}else transactions.unshift({id:Date.now(),type,amount,category,note,date});cancelEdit();persist()}function editTransaction(id){let t=transactions.find(x=>x.id===id);editingId=id;typeEl.value=t.type;document.getElementById('amount').value=t.amount;document.getElementById('category').value=t.category;document.getElementById('note').value=t.note;document.getElementById('date').value=t.date;formTitle.textContent='Edit Transaksi';saveBtn.textContent='Simpan Perubahan';cancelBtn.style.display='block';scrollTo({top:0,behavior:'smooth'})}function cancelEdit(){editingId=null;formTitle.textContent='Tambah Transaksi';saveBtn.textContent='+ Tambah Transaksi';cancelBtn.style.display='none';amount.value='';category.value='';note.value=''}function removeTransaction(id){if(confirm('Hapus transaksi ini?')){transactions=transactions.filter(t=>t.id!==id);persist()}}function populateMonths(){let s=monthFilter,old=s.value,months=[...new Set(transactions.map(t=>t.date.slice(0,7)))].sort().reverse();s.innerHTML='<option value="all">Semua Bulan</option>'+months.map(m=>`<option value="${m}">${new Date(m+'-02').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`).join('');if(months.includes(old))s.value=old}function filtered(){let m=monthFilter.value,t=typeFilter.value,q=searchInput.value.trim().toLowerCase();return transactions.filter(x=>(m==='all'||x.date.startsWith(m))&&(t==='all'||x.type===t)&&(!q||x.category.toLowerCase().includes(q)||x.note.toLowerCase().includes(q)))}function render(){populateMonths();let data=filtered(),inc=0,exp=0;transactions.forEach(t=>t.type==='income'?inc+=t.amount:exp+=t.amount);income.textContent=rupiah(inc);expense.textContent=rupiah(exp);balance.textContent=rupiah(inc-exp);list.innerHTML=data.length?data.map(t=>`<div class="transaction"><div class="left"><div class="icon">${t.type==='income'?'📥':'📤'}</div><div><div class="name">${esc(t.category)}</div><div class="date">${esc(t.date)}${t.note?' · '+esc(t.note):''}</div></div></div><div class="right"><div class="amount ${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'-'}${rupiah(t.amount)}</div><button class="mini secondary" onclick="editTransaction(${t.id})">Edit</button><button class="mini danger" onclick="removeTransaction(${t.id})">Hapus</button></div></div>`).join(''):'<div class="empty">Tidak ada transaksi.</div>';drawChart(data);updateSummary()}function drawChart(data){let c=chart,ctx=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth,h=210;c.width=w*d;c.height=h*d;ctx.scale(d,d);let inc=0,exp=0;data.forEach(t=>t.type==='income'?inc+=t.amount:exp+=t.amount);let max=Math.max(inc,exp,1),bw=Math.min(120,w/3),base=h-38;ctx.clearRect(0,0,w,h);ctx.fillStyle='#16a34a';ctx.fillRect(w*.25-bw/2,base-(inc/max)*(h-75),bw,(inc/max)*(h-75));ctx.fillStyle='#dc2626';ctx.fillRect(w*.75-bw/2,base-(exp/max)*(h-75),bw,(exp/max)*(h-75));ctx.fillStyle='#374151';ctx.font='13px Arial';ctx.textAlign='center';ctx.fillText('Pemasukan',w*.25,h-15);ctx.fillText('Pengeluaran',w*.75,h-15)}function getMonth(){return monthFilter.value==='all'?new Date().toISOString().slice(0,7):monthFilter.value}function saveBudget(){let v=Number(budgetInput.value);if(v<0)return;localStorage.setItem('moneyManagerBudget',v);updateSummary()}function updateSummary(){let m=getMonth(),d=transactions.filter(t=>t.date.startsWith(m)),inc=0,exp=0;d.forEach(t=>t.type==='income'?inc+=t.amount:exp+=t.amount);let b=Number(localStorage.getItem('moneyManagerBudget')||0);budgetInput.value=b||'';budgetInfo.innerHTML=b?`Budget: <b>${rupiah(b)}</b><br>Terpakai: <b>${rupiah(exp)}</b> (${(exp/b*100).toFixed(1)}%)<br>Sisa: <b class="${b-exp<0?'expense':'income'}">${rupiah(b-exp)}</b>${exp>=b?'<br><span class="expense"><b>⚠ Budget terlampaui.</b></span>':exp>=b*.8?'<br><span style="color:#d97706"><b>⚠ Sudah mencapai 80%.</b></span>':''}`:'Belum ada budget bulanan.';monthlySummary.innerHTML=`Bulan: <b>${new Date(m+'-02').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><br>Pemasukan: <span class="income"><b>${rupiah(inc)}</b></span><br>Pengeluaran: <span class="expense"><b>${rupiah(exp)}</b></span><br>Sisa: <b>${rupiah(inc-exp)}</b>`}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(transactions,null,2)],{type:'application/json'}));a.download='money-manager-backup.json';a.click()}function importData(e){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm('Import akan mengganti data saat ini. Lanjutkan?')){transactions=d;persist()}}catch{alert('File backup tidak valid.')}e.target.value=''};r.readAsText(e.target.files[0])}const typeEl=document.getElementById('type');document.getElementById('date').value=new Date().toISOString().slice(0,10);render();addEventListener('resize',()=>drawChart(filtered()));if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
